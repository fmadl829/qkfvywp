  --lockfg:#24427e; --lockshade:rgba(255,255,255,.4);
  --wallui:#1b2433; --label:#1b2433;
  --app:#f6f6f8; --card:#ffffff; --ink:#141416; --sub:#86868c; --line:rgba(0,0,0,.07);
  --frame1:#c8cdd4; --frame2:#9097a1;
  --sans:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --clockface:var(--sans);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121317;--bg-shadow:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121317;--bg-shadow:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
.stage{height:100%;display:flex;align-items:center;justify-content:center}
button{font-family:inherit;color:inherit}

/* 기기 */
.phone{position:relative;flex:none;padding:3px;border-radius:47px;background:linear-gradient(140deg,var(--frame1),var(--frame2) 40%,var(--frame1) 70%,var(--frame2));box-shadow:0 0 0 1px #747a83,0 30px 70px var(--bg-shadow);transform-origin:center}
.bez{padding:7px;border-radius:44px;background:#060607}
.screen{position:relative;width:412px;height:892px;border-radius:36px;overflow:hidden;background:#000 var(--homebg) center/cover;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
.key{position:absolute;right:-4px;width:4px;border-radius:0 3px 3px 0;background:linear-gradient(90deg,#868c95,#c9ced5)}
.key.vol{top:196px;height:104px}.key.pwr{top:326px;height:60px;cursor:pointer}
.key.pwr:active{right:-3px}
.cam{position:absolute;top:13px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#050506;box-shadow:0 0 0 1.5px #1c1c20;z-index:90}

/* 상태 표시줄 */
.sb{position:absolute;top:0;left:0;right:0;height:38px;padding:3px 26px 0;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:500;letter-spacing:-.1px;z-index:80;pointer-events:none;color:var(--ink)}
.sb.wall{color:var(--wallui)}
.sbr{display:flex;align-items:center;gap:5px}
.bat{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:15px;padding:0 3px;box-sizing:border-box;border-radius:5px;background:currentColor;font-size:10.5px;font-weight:700;font-style:normal}
.bat b{color:#fff}
.sb.dk{color:#fff}.sb.dk .bat b{color:#1b2433}

/* 잠금화면 */
#lock{position:absolute;inset:0;z-index:60;background:#000 var(--lockbg) center/cover;color:var(--lockfg);text-align:center;cursor:grab;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s}
#lock.gone{transform:translateY(-22%);opacity:0;pointer-events:none}
.lclock{position:absolute;top:66px;left:0;right:0;font-family:var(--clockface);font-weight:600;font-size:122px;line-height:.9;letter-spacing:-2px;font-variant-numeric:tabular-nums;text-shadow:0 2px 18px var(--lockshade)}
.ldate{position:absolute;top:296px;left:0;right:0;font-size:17px;font-weight:500;text-shadow:0 1px 10px var(--lockshade)}
.lhint{position:absolute;bottom:118px;left:0;right:0;font-size:14px;font-weight:500;text-shadow:0 1px 8px var(--lockshade)}
.lbot{position:absolute;left:20px;right:20px;bottom:30px;display:flex;align-items:center;justify-content:space-between;gap:12px}

function classify(t){const s=t.replace(/\s+/g,' ').trim();
  if(/모르|몰라|몰루|모름|글쎄|아마|애매|헷갈|확실하지|잘 모/.test(s))return 'unc';
  if(/아니|아냐|아닌|아닐|않|ㄴㄴ|노노|안 죽|살아/.test(s))return 'neg';
  const toks=s.split(/[\s,.!?~…]+/).map(w=>w.replace(/[ㅠㅜㅎㅋ.~!?…]+$/,'')).filter(Boolean);
  if(toks.some(w=>/^(응|어|엉|웅|ㅇ|ㅇㅇ|네|예|넹|넵|ㅇㅋ)+$/.test(w)||/^(그래|그렇|맞)/.test(w))||/맞아|맞는|죽었/.test(s))return 'pos';
  return 'other'}

/* 처음 세 통이 다 온 뒤, 대화방에 들어와 있으면 시작 */
function runScript(){if(!viewingChat()){sWaitChat=true;return}sWaitChat=false;setTimeout(nextStep,2000)}

async function runIn(lines){await sleep(1200);markRead();
  for(let i=0;i<lines.length;i++){const t=lines[i];if(i)await sleep(700);setTyping(true);await sleep(1000+Math.min([...t].length*55,2200));arrive(t)}}
async function nextStep(){sIdx++;const st=SCRIPT[sIdx];if(!st)return;
  if(st.in){await runIn(st.in);nextStep()}
  else if(st.wait){await sleep(1500);markRead();await sleep(Math.max(0,st.wait-1500)/TEST_SPEED);nextStep()}
  else if(st.out){sTurn={first:st.out[0],rest:st.out.slice(1),auto:st.auto!==false};fillChoices();updHint();
    if(sTurn.auto&&viewingChat())setTimeout(()=>openKb('choice'),500)}

      key('','','fn w15 nil')+[...'-_/\'"*+'].map(c=>key(c)).join('')+key('BS',I('bksp',24),'fn w15')]

  put('#mkeys','<div class="ktool">'+I('emo',22)+I('stick',22)+I('clip',22)+I('mic',22)+I('gear',22)+I('more',22)+'</div>'
   +rows.map((r,i)=>'<div class="krw'+(i===1&&!kSym?' mid':'')+'">'+r+'</div>').join('')
   +'<div class="krw">'+key('SYM',kSym?'가나다':'!#1','fn w15')+key(',')+key('?')+key(' ','','sp')+key('.')+key('EN',I('enter',22),'fn ent')+'</div>')}
function kPress(k){const inp=$('#mcinput');let v=inp.value;
  if(k==='SH'){kShift=!kShift;return kbRender()}
  if(k==='SYM'){kSym=!kSym;kShift=false;return kbRender()}
  if(k==='EN')return sendMine();

  else if(k)v+=k;
  inp.value=v;inp.setSelectionRange(v.length,v.length);inp.scrollLeft=inp.scrollWidth;updSend();
  if(kShift&&k!=='BS'){kShift=false;kbRender()}}
